# 北极星 NorthStar · 一键编排：后端(FastAPI) + 前端(Nginx 静态+反代)
# 使用前提：先 `cd northstar/frontend && npm run build` 产出 dist/
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data          # SQLite + 抓取器登录态持久化
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
